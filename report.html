<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting with Soleil · Results report</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1F2430; --muted:#5B6272; --line:#E6DFD0; --caught:#1F5E5B; --guessed:#D4A640; --missed:#D9D4CA; --fell:#C2412D; --avoided:#2E8B57; }
  body { font-family: 'Nunito Sans', system-ui, sans-serif; color: var(--ink); background: #FBF4E4; margin: 0; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 24px 60px; }
  h1, h2 { font-family: Bitter, Georgia, serif; line-height: 1.1; }
  h1 { font-size: 36px; margin: 0 0 6px; }
  h2 { font-size: 24px; margin: 36px 0 6px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .load { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  button, label.file { font: inherit; font-weight: 600; border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  input[type=file] { display: none; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-top: 20px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat b { font-family: Bitter, serif; font-size: 30px; display: block; }
  .stat span { color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; margin: 10px 0 4px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
  td small { color: var(--muted); display: block; }
  .bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: #eee; width: 260px; }
  .bar span { height: 100%; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--muted); font-style: italic; }
  .note { font-size: 13px; color: var(--muted); }
  @media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } .bar { width: 140px; } }
.scroll { overflow-x: auto; }
@media (max-width: 600px) { .barcol, td:nth-child(2):has(.bar) { display: none; } table { font-size: 14px; } }
</style>
</head>
<body>
<main>
  <p><a href="index.html">← Back to the game</a></p>
  <h1>Starting with Soleil · Results</h1>
  <p class="sub">This report shows which correct actions players chose, which they missed, and which wrong actions they avoided. Soleil Systems is a fictional company.</p>
  <div class="load">
    <button id="local">Use data from this browser</button>
    <label class="file">Load exported JSON files<input id="files" type="file" accept=".json" multiple></label>
    <button id="csv" disabled>Download decisions CSV</button>
    <span id="status" class="note"></span>
  </div>
  <div id="out"><p class="empty" style="margin-top:20px">Load data to see results.</p></div>
</main>
<script>
(function () {
  const STORE = 'bp_sessions_v1';
  const SEASONS = ['spring', 'summer', 'fall', 'winter'];
  let rows = [];
  const ext = (st, key) => { const e = (st.context && st.context.extensions) || {}; const k = Object.keys(e).find(x => x.endsWith('/ext/' + key)); return k ? e[k] : undefined; };
  const tail = id => { const m = id.match(/\/((?:step|decision|season|intro)\/.*|game)$/); return m ? m[1] : id; }; // works with any activity base

  document.getElementById('local').onclick = () => {
    let all = []; try { all = JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) {}
    analyze(all, 'this browser');
  };
  document.getElementById('files').onchange = async e => {
    const all = [];
    for (const f of e.target.files) { try { const d = JSON.parse(await f.text()); (Array.isArray(d) ? d : [d]).forEach(s => all.push(s)); } catch (err) {} }
    const seen = new Set(); analyze(all.filter(s => s.sessionId && !seen.has(s.sessionId) && seen.add(s.sessionId)), e.target.files.length + ' file(s)');
  };
  document.getElementById('csv').onclick = () => {
    const head = 'session,player,cohort,season,role,decision,label,type,outcome,saw_clue\n';
    const body = rows.map(r => [r.session, r.player, r.cohort, r.season, r.role, r.id, '"' + r.label.replace(/"/g, '""') + '"', r.type, r.outcome, r.sawClue].join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([head + body], { type: 'text/csv' })); a.download = 'soleil-decisions.csv'; a.click();
  };

  function analyze(sessions, source) {
    const played = sessions.filter(s => (s.statements || []).some(st => st.verb.display['en-US'] === 'responded'));
    const finished = played.filter(s => s.statements.some(st => st.verb.display['en-US'] === 'completed' && tail(st.object.id) === 'game'));
    rows = [];
    const decisions = {}; const clues = {}; const stepsSeen = {}; const seasonEnd = {};
    played.forEach(s => {
      s.statements.forEach(st => {
        const verb = st.verb.display['en-US'], id = tail(st.object.id);
        if (verb === 'evaluated') {
          const r = { session: s.sessionId, player: s.playerId, cohort: s.cohort || '', season: ext(st, 'season'), role: ext(st, 'role'), id: id.replace('decision/', ''),
            label: st.object.definition.name['en-US'], type: ext(st, 'decisionType'), outcome: ext(st, 'outcome'), sawClue: ext(st, 'sawClue') };
          rows.push(r);
          const d = decisions[r.id] = decisions[r.id] || { label: r.label, type: r.type, season: r.season, role: r.role, n: 0, caught: 0, guessed: 0, missed: 0, avoided: 0, fell_for: 0 };
          d.n++; d[r.outcome]++;
        }
        if (verb === 'experienced' && id.startsWith('step/')) { const step = id.split('/')[1]; stepsSeen[step] = (stepsSeen[step] || new Set()).add(s.sessionId); }
        const cm = verb === 'viewed' && id.match(/^step\/([^/]+)\/clue\/([^/]+)$/);
        if (cm) { const [, step, clue] = cm; const k = step + ' · ' + clue; const name = (st.object.definition && st.object.definition.name && st.object.definition.name['en-US']) || clue; clues[k] = clues[k] || { step, clue: name, sessions: new Set() }; clues[k].sessions.add(s.sessionId); }
        if (verb === 'completed' && id.startsWith('season/')) { const sea = id.split('/')[1]; (seasonEnd[sea] = seasonEnd[sea] || []).push({ mood: ext(st, 'mood'), days: ext(st, 'days') }); }
      });
    });
    document.getElementById('status').textContent = `${played.length} ${played.length === 1 ? 'game' : 'games'} from ${source}.`;
    document.getElementById('csv').disabled = !rows.length;
    const out = document.getElementById('out');
    if (!rows.length) { out.innerHTML = '<p class="empty" style="margin-top:20px">No gameplay data yet.</p>'; return; }

    const doRows = rows.filter(r => r.type === 'do');
    const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
    const caught = doRows.filter(r => r.outcome === 'caught').length, guessed = doRows.filter(r => r.outcome === 'guessed').length;
    const avoidRows = rows.filter(r => r.type === 'avoid');
    let html = `<div class="stats">
      <div class="stat"><b>${played.length}</b><span>games played</span></div>
      <div class="stat"><b>${pct(finished.length, played.length)}%</b><span>finished all four seasons</span></div>
      <div class="stat"><b>${pct(caught, doRows.length)}%</b><span>correct actions chosen after checking the information</span></div>
      <div class="stat"><b>${pct(guessed, doRows.length)}%</b><span>correct actions chosen without checking the information</span></div>
    </div>
    <p class="note" style="margin-top:10px">Wrong actions avoided: ${pct(avoidRows.filter(r => r.outcome === 'avoided').length, avoidRows.length)}% (out of ${avoidRows.length}).</p>`;

    html += `<h2>Correct actions</h2><p class="sub">Actions players should choose. "Guessed" means the player chose it without opening the information that pointed to it.</p>
      <div class="legend"><span><i style="background:var(--caught)"></i>Chose it after checking</span><span><i style="background:var(--guessed)"></i>Guessed</span><span><i style="background:var(--missed)"></i>Missed</span></div>`;
    html += table(Object.entries(decisions).filter(([, d]) => d.type === 'do'), d => [['caught', 'var(--caught)'], ['guessed', 'var(--guessed)'], ['missed', 'var(--missed)']]);
    html += `<h2>Wrong actions</h2><p class="sub">Actions that seem reasonable but cost the homeowner time or money.</p>
      <div class="legend"><span><i style="background:var(--avoided)"></i>Avoided</span><span><i style="background:var(--fell)"></i>Chose it</span></div>`;
    html += table(Object.entries(decisions).filter(([, d]) => d.type === 'avoid'), d => [['avoided', 'var(--avoided)'], ['fell_for', 'var(--fell)']]);

    html += `<h2>Information opened</h2><p class="sub">Percent of players who opened each item.</p><div class="scroll"><table><tr><th>Step</th><th>Item</th><th class="num">Opened</th></tr>`;
    Object.values(clues).sort((a, b) => SEASONS.indexOf(a.step.split('-')[0]) - SEASONS.indexOf(b.step.split('-')[0])).forEach(c => {
      const n = (stepsSeen[c.step] || new Set()).size;
      const [sea, ...rl] = c.step.split('-'); const stepName = sea[0].toUpperCase() + sea.slice(1) + ' · ' + rl.join(' ').replace('care 2', 'care callback');
      html += `<tr><td>${stepName}</td><td>${c.clue}</td><td class="num">${pct(c.sessions.size, n)}% <small>${c.sessions.size} of ${n}</small></td></tr>`;
    });
    html += `</table></div><h2>Dana's year</h2><div class="scroll"><table><tr><th>Season</th><th class="num">Average days with a problem</th><th class="num">Average mood at season end (0 to 100)</th></tr>`;
    SEASONS.forEach(se => { const a = seasonEnd[se] || []; if (!a.length) return;
      const avg = k => Math.round(a.reduce((x, y) => x + (y[k] || 0), 0) / a.length);
      html += `<tr><td>${se[0].toUpperCase() + se.slice(1)}</td><td class="num">${avg('days')}</td><td class="num">${avg('mood')}</td></tr>`; });
    html += `</table></div><p class="note" style="margin-top:20px">Each game played counts once. If a player plays again, that counts as another game.</p>`;
    out.innerHTML = html;

    function table(list, keys) {
      list.sort((a, b) => SEASONS.indexOf(a[1].season) - SEASONS.indexOf(b[1].season));
      let t = `<div class="scroll"><table><tr><th>Action</th><th class="barcol"></th>${keys().map(k => `<th class="num">${({ caught: 'Checked', guessed: 'Guessed', missed: 'Missed', avoided: 'Avoided', fell_for: 'Chose it' })[k[0]]}</th>`).join('')}</tr>`;
      list.forEach(([, d]) => {
        t += `<tr><td>${d.label}<small>${d.season} · ${d.role} · ${d.n} ${d.n === 1 ? 'game' : 'games'}</small></td><td><div class="bar">${keys().map(k => `<span style="width:${pct(d[k[0]], d.n)}%;background:${k[1]}"></span>`).join('')}</div></td>` +
          keys().map(k => `<td class="num">${pct(d[k[0]], d.n)}%</td>`).join('') + '</tr>';
      });
      return t + '</table></div>';
    }
  }
})();
</script>
</body>
</html>
